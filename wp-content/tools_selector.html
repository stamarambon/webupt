<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag Hover & Map Select</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --map-highlight: #3b82f6;
            --map-default: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1250px;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            user-select: none;
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            font-size: 1.5rem;
        }

        p.instruction {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        
        #map {
            height: 400px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            z-index: 1;
            
        }

.leaflet-container {
    overflow: hidden !important;
}


.leaflet-map-pane {
    overflow: visible !important;
}





.leaflet-tooltip-pane {
    overflow: visible !important;
}



        
        .prefix-filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
        }

        .btn-toggle-p { background-color: #1e40af; }
        .btn-toggle-l { background-color: #854d0e; }
        .btn-toggle-t { background-color: #9d174d; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .select-item {
            background: white;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 50px;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
            box-sizing: border-box;
        }

        .select-item.selected {
            background-color: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .id-badge {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .prefix-P { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .prefix-L { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .prefix-T { background-color: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }

        .item-text {
            word-break: break-word;
            line-height: 1.3;
        }

        .result-box {
            background: #e3e4e5;
            color: #000000;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            min-height: 45px;
            word-break: break-word;
            margin-bottom: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn-copy { background-color: #16a34a; }
        .btn-clear { background-color: #ef4444; }
        button:hover { opacity: 0.9; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #334155;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        @media (max-width: 1024px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Pilih Wilayah Perairan</h2>
    <p class="instruction">
         Cara Pakai: <b>Klik area pada peta/button</b> ATAU <b>klik-tahan dan geser kursor melewati peta/button</b> di bawah untuk memilih wilayah secara beruntun.
    </p>

    <div id="map"></div>

    <div class="btn-group prefix-filter-group">
        <button class="btn-toggle-p" onclick="togglePrefix('P')"> Toggle All P (WILPRO)</button>
        <button class="btn-toggle-l" onclick="togglePrefix('L')"> Toggle All L (Laut)</button>
        <button class="btn-toggle-t" onclick="togglePrefix('T')"> Toggle All T </button>
    </div>
    
    <div class="grid-container" id="gridContainer"></div>
    
    <p class="instruction"><b>Hasil Kalimat Otomatis:</b></p>
    <div class="result-box" id="resultText">Silakan pilih wilayah melalui peta atau daftar di atas...</div>
    
    <div class="btn-group">
        <button class="btn-copy" onclick="copyResult()">Salin Kalimat</button>
        <button class="btn-clear" onclick="resetAll()">Reset Pilihan</button>
    </div>
</div>

<div id="toast" class="toast">Kalimat berhasil disalin!</div>

        { id: "T01. Laut Seram bagian barat", text: "Laut Seram bagian barat" },

        { id: "T15. Perairan Kep. Aru", text: "Perairan Kep. Aru" },
        { id: "P12. Perairan Utara Kep. Aru", text: "Perairan Utara Kep. Aru" },
        { id: "P13. Perairan Selatan Kep. Aru", text: "Perairan Selatan Kep. Aru" },

        { id: "T07. Laut Banda utara bagian timur", text: "Laut Banda utara bagian timur" },

        { id: "T09. Laut Banda selatan bagian timur", text: "Laut Banda selatan bagian timur" },
        { id: "L02. Laut Arafuru", text: "Laut Arafuru" },
        { id: "T13. Laut Arafuru bagian barat", text: "Laut Arafuru bagian barat" },
        { id: "T16. Laut Arafuru bagian tengah", text: "Laut Arafuru bagian tengah" }
    ];

    let urutanTerpilih = [];
    let isMouseDown = false;
    let isSelectingMode = true;

    const gridContainer = document.getElementById('gridContainer');
    const resultText = document.getElementById('resultText');
    const toast = document.getElementById('toast');

    
    const map = L.map('map').setView([-5.5, 129.5], 6); 
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CARTO'
    }).addTo(map);

    let geojsonLayer;

    
    function initMap() {
        if (geojsonData && geojsonData.features) {
            geojsonLayer = L.geoJSON(geojsonData, {
                style: mapStyle,
                onEachFeature: onEachFeatureMap
            }).addTo(map);
            
            map.fitBounds(geojsonLayer.getBounds());
        } else {
            console.warn("Data GeoJSON belum diganti atau format salah.");
        }
    }

    function mapStyle(feature) {
        const isSelected = urutanTerpilih.includes(feature.properties.perairan);
        return {
            fillColor: isSelected ? 'var(--map-highlight)' : 'var(--map-default)',
            weight: 1.5,
            opacity: 1,
            color: 'white',
            fillOpacity: isSelected ? 0.7 : 0.35
        };
    }

   
function onEachFeatureMap(feature, layer) {
    
   
    layer.on('mouseover', function (e) {
        const l = e.target;
        l.setStyle({ weight: 2.5, color: '#1e40af' });
        l.bringToFront();

        
        if (isMouseDown) {
            const text = feature.properties.perairan;
            const validArea = daftarWilayah.find(w => w.text === text);
            if (validArea) {
                updateCentralState(text, isSelectingMode);
            }
        }

        
        if (feature.properties && feature.properties.perairan) {
            let tooltipEl = document.getElementById('global-tooltip');
            if (!tooltipEl) {
                tooltipEl = document.createElement('div');
                tooltipEl.id = 'global-tooltip';
                
                tooltipEl.style.position = 'fixed';
                tooltipEl.style.padding = '6px 10px';
                tooltipEl.style.background = 'rgba(0, 0, 0, 0.8)';
                tooltipEl.style.color = '#fff';
                tooltipEl.style.borderRadius = '4px';
                tooltipEl.style.fontSize = '12px';
                tooltipEl.style.zIndex = '9999';
                tooltipEl.style.pointerEvents = 'none';
                tooltipEl.style.whiteSpace = 'nowrap';
                document.body.appendChild(tooltipEl);
            }
            tooltipEl.innerHTML = feature.properties.perairan;
            tooltipEl.style.display = 'block';
        }
    });

    layer.on('mousemove', function (e) {
        const tooltipEl = document.getElementById('global-tooltip');
        if (tooltipEl) {
            
            tooltipEl.style.left = (e.originalEvent.clientX + 15) + 'px';
            tooltipEl.style.top = (e.originalEvent.clientY + 15) + 'px';
        }
    });

    layer.on('mouseout', function (e) {
        if(geojsonLayer) geojsonLayer.resetStyle(e.target);

        
        const tooltipEl = document.getElementById('global-tooltip');
        if (tooltipEl) {
            tooltipEl.style.display = 'none';
        }
    });

    
    layer.on('mousedown', function () {
        map.dragging.disable(); 
        isMouseDown = true;
        
        const text = feature.properties.perairan;
        const validArea = daftarWilayah.find(w => w.text === text);
        
        if (validArea) {
            const isCurrentlySelected = urutanTerpilih.includes(text);
            isSelectingMode = !isCurrentlySelected;
            updateCentralState(text, isSelectingMode);
        }
    });
}


    
    initMap();

    
    daftarWilayah.forEach((itemData) => {
        const item = document.createElement('div');
        item.className = 'select-item';
        item.dataset.value = itemData.text; 

        const prefixLetter = itemData.id.charAt(0);
        item.dataset.prefix = prefixLetter; 
        
        const firstDotSpaceIndex = itemData.id.indexOf('. ');
        let codeId = "";
        let restText = "";

        if (firstDotSpaceIndex !== -1) {
            codeId = itemData.id.substring(0, firstDotSpaceIndex + 1); 
            restText = itemData.id.substring(firstDotSpaceIndex + 2);
        } else {
            codeId = itemData.id;
            restText = itemData.text;
        }

        item.innerHTML = `<span class="id-badge prefix-${prefixLetter}">${codeId}</span><span class="item-text">${restText}</span>`;

        item.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            isSelectingMode = !item.classList.contains('selected');
            updateCentralState(item.dataset.value, isSelectingMode);
        });

        item.addEventListener('mouseenter', () => {
            if (isMouseDown) {
                updateCentralState(item.dataset.value, isSelectingMode);
            }
        });

        gridContainer.appendChild(item);
    });

    
    window.addEventListener('mouseup', () => {
        isMouseDown = false;
        if (map) map.dragging.enable(); 
    });

    function updateCentralState(textValue, jadikanSelected) {
        const itemElement = document.querySelector(`.select-item[data-value="${textValue}"]`);
        if (itemElement) {
            if (jadikanSelected) {
                itemElement.classList.add('selected');
            } else {
                itemElement.classList.remove('selected');
            }
        }

        urutanTerpilih = daftarWilayah
            .filter(wilayah => {
                const el = document.querySelector(`.select-item[data-value="${wilayah.text}"]`);
                return el && el.classList.contains('selected');
            })
            .map(wilayah => wilayah.text);

        susunKalimat();

        if (geojsonLayer) {
            geojsonLayer.eachLayer(layer => {
                geojsonLayer.resetStyle(layer); 
            });
        }
    }

    
    function togglePrefix(prefix) {
        const targetItems = Array.from(document.querySelectorAll(`.select-item[data-prefix="${prefix}"]`));
        const adaYangBelumSelected = targetItems.some(item => !item.classList.contains('selected'));

        targetItems.forEach(item => {
            if (adaYangBelumSelected) {
                item.classList.add('selected');
            } else {
                item.classList.remove('selected');
            }
        });

        urutanTerpilih = daftarWilayah
            .filter(wilayah => {
                const el = document.querySelector(`.select-item[data-value="${wilayah.text}"]`);
                return el && el.classList.contains('selected');
            })
            .map(wilayah => wilayah.text);

        susunKalimat();
        
        if (geojsonLayer) {
            geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
        }
    }

    function susunKalimat() {
        if (urutanTerpilih.length === 0) {
            resultText.textContent = "Silakan pilih wilayah melalui peta atau daftar di atas...";
            return;
        }

        let pilihan = [...urutanTerpilih];
        let kalimatFinal = "";

        if (pilihan.length === 1) {
            kalimatFinal = pilihan[0] + ".";
        } else if (pilihan.length === 2) {
            kalimatFinal = pilihan[0] + " dan " + pilihan[1] + ".";
        } else {
            const kataTerakhir = pilihan.pop();
            kalimatFinal = pilihan.join(", ") + ", dan " + kataTerakhir + ".";
        }

        resultText.textContent = kalimatFinal;
    }

    function copyResult() {
        const teks = resultText.textContent;
        if (teks.startsWith("Silakan")) return;

        navigator.clipboard.writeText(teks).then(() => {
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        });
    }

    function resetAll() {
        urutanTerpilih = [];
        document.querySelectorAll('.select-item').forEach(item => {
            item.classList.remove('selected');
        });
        resultText.textContent = "Silakan pilih wilayah melalui peta atau daftar di atas...";
        
        if (geojsonLayer) {
            geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
        }
    }
</script>
